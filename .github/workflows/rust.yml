name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Check formatting
      run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: dtolnay/rust-toolchain@stable
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libglib2.0-dev libgdk-pixbuf2.0-dev libnotify-dev
    - name: Run clippy (deny warnings)
      run: cargo clippy --workspace --all-targets -- -D warnings

  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: dtolnay/rust-toolchain@stable
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libglib2.0-dev libgdk-pixbuf2.0-dev libnotify-dev
    - name: Build all targets
      run: cargo build --workspace --all-targets --verbose

  test:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: dtolnay/rust-toolchain@stable
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libglib2.0-dev libgdk-pixbuf2.0-dev libnotify-dev
    - name: Run tests
      run: cargo test --workspace --all-targets --verbose

  reproducible-build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: dtolnay/rust-toolchain@stable
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libglib2.0-dev libgdk-pixbuf2.0-dev libnotify-dev
    - name: Reproducible build check
      run: |
        echo "=== Reproducible Build Check ==="
        echo "Step 1: Verifying Cargo.lock is up-to-date (pinned deps)..."
        cargo update --locked || { echo "ERROR: Cargo.lock out of date. Run 'cargo update' and commit the result."; exit 1; }
        echo "Step 2: Cleaning build artifacts for fresh build..."
        cargo clean
        echo "Step 3: Building with deterministic settings..."
        CARGO_INCREMENTAL=0 \
         RUSTFLAGS="-C target-cpu=native" \
         cargo build --workspace --release
        echo "Step 3: Verifying no dev-dependency drift..."
        cargo tree --workspace --depth 1 | head -30
        echo "=== Reproducible build verified ==="

  module-sizes:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Check module sizes
      run: python scripts/module-sizes.py --threshold 500

  snapshot-review:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install cargo-insta
      run: cargo install cargo-insta --quiet
    - name: Review snapshots (fail on pending)
      run: cargo insta test --review --test snapshot_tests

  e2e-smoke:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: dtolnay/rust-toolchain@stable
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libglib2.0-dev libgdk-pixbuf2.0-dev libnotify-dev
    - name: Run E2E smoke tests (~30s)
      run: cargo test --test e2e --release

  e2e-full:
    runs-on: ubuntu-24.04
    needs: [build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'schedule'
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: dtolnay/rust-toolchain@stable
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libglib2.0-dev libgdk-pixbuf2.0-dev libnotify-dev
    - name: Run full E2E integration suite (~5min)
      run: cargo test --test e2e_full --release