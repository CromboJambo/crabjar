name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Check formatting
      run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libglib2.0-dev libgdk-pixbuf2.0-dev libnotify-dev
    - name: Run clippy (deny warnings)
      run: cargo clippy --workspace --all-targets -- -D warnings

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libglib2.0-dev libgdk-pixbuf2.0-dev libnotify-dev
    - name: Build all targets
      run: cargo build --workspace --all-targets --verbose

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libglib2.0-dev libgdk-pixbuf2.0-dev libnotify-dev
    - name: Run tests
      run: cargo test --workspace --all-targets --verbose

  reproducible-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libglib2.0-dev libgdk-pixbuf2.0-dev libnotify-dev
    - name: Reproducible build check
      run: |
        echo "=== Reproducible Build Check ==="
        echo "Step 1: Verifying Cargo.lock is up-to-date (pinned deps)..."
        cargo update --locked || { echo "ERROR: Cargo.lock out of date. Run 'cargo update' and commit the result."; exit 1; }
        echo "Step 2: Building with deterministic settings..."
        CARGO_INCREMENTAL=0 \
         RUSTFLAGS="-C target-cpu=native" \
         cargo build --workspace --release
        echo "Step 3: Verifying no dev-dependency drift..."
        cargo tree --workspace --depth 1 | head -30
        echo "=== Reproducible build verified ==="

  module-sizes:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Check module sizes
      run: python scripts/module-sizes.py --threshold 500

  snapshot-review:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install cargo-insta (pre-built binary)
      run: |
        INSTA_VERSION=$(curl -s https://api.github.com/repos/mitsuhiko/insta/releases/latest | grep '"tag_name"' | sed -E 's/.*"v([^"]+)".*/\1/')
        curl -L "https://github.com/mitsuhiko/insta/releases/download/v${INSTA_VERSION}/cargo-insta-${INSTA_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar xz -C ~/.cargo/bin
    - name: Review snapshots (fail on pending)
      run: cargo insta test --review --test snapshot_tests

  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libglib2.0-dev libgdk-pixbuf2.0-dev libnotify-dev
    - name: Run E2E smoke tests (~30s)
      run: cargo test --test e2e_smoke --release

  e2e-full:
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'schedule'
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libglib2.0-dev libgdk-pixbuf2.0-dev libnotify-dev
    - name: Run full E2E integration suite (~5min)
      run: cargo test --test e2e_full --release

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - name: Install cargo-audit (pre-built binary)
      run: |
        AUDIT_VERSION=$(curl -s https://api.github.com/repos/rustsec/cargo-audit/releases/latest | grep '"tag_name"' | sed -E 's/.*"v([0-9.]+)".*/\1/')
        curl -L "https://github.com/rustsec/cargo-audit/releases/download/v${AUDIT_VERSION}/cargo-audit-v${AUDIT_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar xz -C ~/.cargo/bin
    - name: Audit dependencies for known vulnerabilities
      run: cargo audit --workspace --ignore RUSTSEC-2024-XXXXX --deny warnings
