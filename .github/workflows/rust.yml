name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Check formatting
      run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run clippy (deny warnings)
      run: cargo clippy --workspace --all-targets -- -D warnings

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build all targets
      run: cargo build --workspace --all-targets --all-features --verbose

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run tests
      run: cargo test --workspace --all-targets --all-features --verbose

  reproducible-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Reproducible build check
      run: just reproducible-build

  module-sizes:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Check module sizes
      run: python scripts/module-sizes.py --threshold 500
