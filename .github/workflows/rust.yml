name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Check formatting
      run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run clippy (deny warnings)
      run: cargo clippy --workspace --all-targets -- -D warnings

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build all targets
      run: cargo build --workspace --all-targets --all-features --verbose

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run tests
      run: cargo test --workspace --all-targets --all-features --verbose

  reproducible-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Reproducible build check
      run: |
        echo "=== Reproducible Build Check ==="
        echo "Step 1: Verifying Cargo.lock is up-to-date (pinned deps)..."
        cargo update --locked || { echo "ERROR: Cargo.lock out of date. Run 'cargo update' and commit the result."; exit 1; }
        echo "Step 2: Building with deterministic settings..."
        CARGO_INCREMENTAL=0 \
         RUSTFLAGS="-C target-cpu=native" \
         cargo build --workspace --release
        echo "Step 3: Verifying no dev-dependency drift..."
        cargo tree --workspace --depth 1 | head -30
        echo "=== Reproducible build verified ==="

  module-sizes:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Check module sizes
      run: python scripts/module-sizes.py --threshold 500

  snapshot-review:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install cargo-insta (pre-built binary)
      run: |
        INSTA_VERSION=$(curl -s https://api.github.com/repos/mitsuhiko/insta/releases/latest | grep '"tag_name"' | sed -E 's/.*"v([^"]+)".*/\1/')
        curl -L "https://github.com/mitsuhiko/insta/releases/download/v${INSTA_VERSION}/cargo-insta-${INSTA_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar xz -C ~/.cargo/bin
    - name: Review snapshots (fail on pending)
      run: cargo insta test --review --test snapshot_tests
