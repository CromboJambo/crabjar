name: Dependency Audit (Optional)

on:
  workflow_dispatch:
    inputs:
      audit:
        description: "Run cargo audit (vulnerability scan)"
        required: false
        default: true
        type: boolean
      deny:
        description: "Run cargo deny (license compliance)"
        required: false
        default: true
        type: boolean
  schedule:
    # Weekly audit on Sundays at midnight UTC
    - cron: "0 0 * * 0"

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-audit:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.audit }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.1 --locked
      
      - name: Run cargo audit
        run: cargo audit --all-targets

  cargo-deny:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.deny }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.19.8 --locked
      
      - name: Run cargo deny (licenses)
        run: cargo deny check licenses
