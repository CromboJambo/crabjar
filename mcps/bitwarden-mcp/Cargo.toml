[package]
name = "bitwarden-mcp"
version = "0.1.0"
edition = "2021"

# Standalone workspace — bitwarden crate has conflicting typenum bounds with crabjar's russh dep
[workspace]

[[bin]]
name = "bitwarden-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.5", features = ["server"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
anyhow = "1"
bitwarden = { version = "2.1", features = ["secrets"] }
uuid = { version = "1", features = ["v4", "serde"] }
toml = "0.8"
