[package]
name = "crabjar-telemetry"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Flight recorder telemetry: append-only command transcript logging with stdout/stderr capture, exit codes, timestamps, and git diff snapshots"

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
bitcode = "0.6"
chrono.workspace = true
uuid.workspace = true
rusqlite.workspace = true
tracing.workspace = true
thiserror.workspace = true
cargo-declared.workspace = true
path-absolutize.workspace = true
sha2.workspace = true
hex.workspace = true
ignore.workspace = true
hmac = "0.12"
getrandom = "0.3"
base64 = "0.22"

# OpenTelemetry (optional)
opentelemetry = { version = "0.33", features = ["trace"], optional = true }
opentelemetry_sdk = { version = "0.33", features = ["trace", "rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.33", features = ["grpc-tonic"], optional = true }

[features]
default = []
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp"]

[dev-dependencies]
tempfile.workspace = true
