[workspace]
members = [
    # Core crates
    "memory",
    "guard",
    "telemetry",
    "orchestrator",
    "sandbox",
    "tool_registry",
    "axum-mux",
    "crabjar-architecture",
    # Host runtime
    "host/host-core",
    "host/host-system",
    "host/host-observe",
    "host/host-agent",
    "host/host-webview",
    "host/host-mqtt",
    "host/host-graph",
    "host/host-screen",
    # Terminal multiplexer integration
    "crates/terminal",
    # Host apps
    "apps/teams",
    "apps/terrarium",
    # Host binary
    "src/host-binary",
    # Skill crates
    "src/skill-script-runner",
    "src/skill-reference-store",
    # Zed ACP
    "zed-acp-bridge",
    "zed-acp-server",
    # Plugin system
    "crabjar-plugin",
]

resolver = "2"

[workspace.package]
version = "0.12.0"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["CrabJar Contributors"]
repository = "https://github.com/crombojambo/crabjar"
documentation = "https://docs.crabjar.io"
homepage = "https://crabjar.io"
description = "CrabJar workspace"
keywords = ["ml", "mcp", "cli", "runtime"]
categories = ["science", "network-programming", "asynchronous"]

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_docs_in_private_items = "allow"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_html_tags = "deny"

[workspace.dependencies]
# Async runtime
async-trait = "0.1"
futures = "0.3"
tokio = { version = "1.51.1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["time"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Patterns
regex = "1.12"

# Database
rusqlite = { version = "0.37", features = ["bundled"] }

# CLI parsing
clap = { version = "4.5", features = ["derive", "env"] }
clap_mangen = "0.2"

# UI / TTY
crossterm = "0.28"
ratatui = "0.30"

# WebView / Tauri
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tauri-plugin-tray = "2"

# System integration
libnotify = "1.0"
arboard = "3"
keyring = "3"

# MQTT
rumqttc = "0.24"

# UUID / time
uuid = { version = "1.23.0", features = ["v4", "serde"] }
chrono = { version = "0.4.38", default-features = false, features = ["serde", "now"] }
tempfile = "3.24.0"

# Networking
reqwest = { version = "0.13.2", default-features = false, features = ["json", "stream"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tower-http = { version = "0.5", features = ["cors"] }
futures-util = "0.3"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tracing-error = "0.2"

# Cargo tools
cargo-declared = "0.1.3"

# Security / filesystem
ignore = "0.4"
path-absolutize = "3.1"
sha2 = "0.10"
hex = "0.4"

# Utility
which = "7"
dirs = "6.0"
base64 = "0.22"

# Zed extension API
zed_extension_api = "0.2"

# CrabJar lib
crabjar_lib = { path = ".", package = "crabjar" }

# Tokenization
tiktoken-rs = "0.11.0"

# Testing
rstest = "0.26.1"
serial_test = "3.2.0"

[profile.profiling]
inherits = "release"
debug = 2

[profile.release]
opt-level = 3
lto = true
strip = true

[package]
name = "crabjar"
publish = true
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "CLI for local state-docs management with project-scoped CrabJar config loading"
repository.workspace = true
documentation.workspace = true

[[bin]]
name = "crabjar"
path = "src/main.rs"

[[test]]
name = "cli"
harness = true

[[test]]
name = "e2e"
path = "tests/e2e/mod.rs"

[[test]]
name = "e2e_full"
path = "tests/e2e/full.rs"

[lib]
name = "crabjar_lib"
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

# Error handling
thiserror.workspace = true

# Knowledge store
agent-context = { path = "memory" }
crabjar-guard = { path = "guard" }
crabjar-telemetry = { path = "telemetry" }
crabjar-tool-registry = { path = "tool_registry" }
crabjar-terminal = { path = "crates/terminal" }

# Database
rusqlite.workspace = true

# CLI parsing
clap.workspace = true
crossterm.workspace = true
ratatui.workspace = true

# UUID
uuid.workspace = true
cargo-declared = "0.1.3"
tiktoken-rs = "0.11.0"
chrono.workspace = true
tempfile.workspace = true
which.workspace = true

[build-dependencies]
clap = { workspace = true }
clap_mangen = { workspace = true }

[dev-dependencies]
tempfile.workspace = true
crabjar-host-core = { path = "host/host-core" }
crabjar-host-agent = { path = "host/host-agent" }
insta = { version = "1.43", features = ["json"] }
