strum = { version = "0.28.0", features = ["derive"] }
tar = "0.4.45"
burn-cubecl-fusion = { path = "burn/crates/burn-cubecl-fusion", version = "0.22.0-pre.1", default-features = false }
futures-lite = { version = "2.6.1", default-features = false }
