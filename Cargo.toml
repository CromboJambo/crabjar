[workspace]
members = [
    "src/crabjar-config",
    "memory",
    "orchestrator",
    "src/codeburn-provider",
    "src/codeburn-config",
    "src/codeburn-classifier",
    "src/codeburn-pricing",
    "src/codeburn",
    "src/skill-script-runner",
    "src/skill-reference-store",
    "guard",
    "telemetry",
    "sandbox",
    "safetensors",
    "tool_registry",
    "src/llm-plug-in",
    "src/llm-runner",
    "src/gguf",
    "src/gguf-cli",
    "zed-acp-bridge",
    "zed-acp-server",
]

resolver = "2"

[workspace.package]
version = "0.11.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["CrabJar Contributors"]
repository = "https://github.com/crombojambo/crabjar"
documentation = "https://docs.crabjar.io"
homepage = "https://crabjar.io"
description = "CrabJar workspace"
keywords = ["ml", "mcp", "cli"]
categories = ["science", "network-programming", "asynchronous"]

[workspace.lints.clippy]
[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_html_tags = "deny"

[workspace.dependencies]
# Async runtime
async-trait = "0.1"
futures = "0.3"
tokio = { version = "1.51.1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["time"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Database
rusqlite = { version = "0.37", features = ["bundled"] }

# CLI parsing
clap = { version = "4.5", features = ["derive", "env"] }
clap_mangen = "0.2"

# UI / TTY
crossterm = "0.28"
ratatui = "0.30.0"

tempfile = "3.24.0"
uuid = { version = "1.23.0", features = ["v4"] }
chrono = { version = "0.4.38", default-features = false, features = ["serde", "now"] }

# Networking
reqwest = { version = "0.13.2", default-features = false, features = ["json", "stream"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tower-http = { version = "0.5", features = ["cors"] }
futures-util = "0.3"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Cargo tools
cargo-declared = "0.1.3"

# Security
ignore = "0.4"
path-absolutize = "3.1"
sha2 = "0.10"
hex = "0.4"

# Utility
which = "7"

# Zed extension API
zed_extension_api = "0.2"

# CrabJar lib
crabjar_lib = { path = ".", package = "crabjar" }

# ML inference
candle-core = { version = "0.10.2", package = "candle-core" }
candle-nn = { version = "0.10.2" }
candle-transformers = { version = "0.10.2" }
candle-datasets = { version = "0.10.2" }

# Local LLM inference
mistralrs = { version = "0.8", features = ["cuda"] }

# Burn framework
burn = { version = "0.21.0", default-features = false }
burn-core = { version = "0.21.0" }
burn-nn = { version = "0.21.0" }
burn-autodiff = { version = "0.21.0" }
burn-train = { version = "0.21.0", default-features = false }
burn-cpu = { version = "0.21.0" }

# MCP protocol
rmcp = { version = "1.7.0", features = ["server", "macros"] }
rmcp-macros = { version = "1.7.0" }
schemars = { version = "1.0", features = ["chrono04"] }
pastey = { version = "0.2.0" }

# Tokenization
tiktoken-rs = "0.11.0"

# Shared ML deps
safetensors = { version = "0.7.0", default-features = false }

# Candle deps
accelerate-src = { version = "0.3.2" }
byteorder = { version = "1.4.3", default-features = false }
cudarc = { version = "0.19.4", features = ["std", "cublas", "cublaslt", "curand", "driver", "nvrtc", "f16", "f8", "cuda-12050", "dynamic-linking"], default-features = false }
gemm = { version = "0.19.0", features = ["wasm-simd128-enable"] }
half = { version = "2.7.1", features = ["num-traits", "use-intrinsics", "rand_distr"] }
float8 = { version = "0.7.0", features = ["num-traits", "rand_distr"] }
intel-mkl-src = { version = "0.8.1", features = ["mkl-static-lp64-iomp"] }
libc = { version = "0.2.186" }
libm = "0.2.15"
memmap2 = { version = "0.9.3", features = ["stable_deref_trait"] }
num-traits = { version = "0.2.19", default-features = false, features = ["libm"] }
num_cpus = "1.15.0"
rayon = "1.10.0"
tokenizers = { version = "0.22.0", default-features = false }
yoke = { version = "0.8.1", features = ["derive"] }
zip = { version = "8.6.0", default-features = false }
hf-hub = "0.4.1"
parquet = "58"
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png"] }
objc2-metal = "0.3.1"
objc2-foundation = "0.3.1"
criterion = { version = "0.8", default-features = false }
rand = { version = "0.10.1", default-features = false, features = ["std_rng"] }
rand_distr = { version = "0.6.0", default-features = false }

# Burn deps
burn-std = { version = "0.21.0", default-features = false }
burn-dataset = { version = "0.21.0", default-features = false }
burn-derive = { version = "0.21.0", default-features = false }
burn-tensor = { version = "0.21.0", default-features = false }
burn-backend = { version = "0.21.0", default-features = false }
burn-dispatch = { version = "0.21.0" }
burn-backend-extension = { version = "0.21.0", default-features = false }
burn-ir = { version = "0.21.0" }
data-encoding = { version = "2.11.0", default-features = false, features = ["alloc"] }
derive-new = { version = "0.7.0", default-features = false }
log = "0.4"
hashbrown = "0.16"
flate2 = "1.1.9"
ahash = { version = "0.8.12", default-features = false }
bincode = { version = "2.0.1", features = ["alloc", "serde", "std"] }
spin = { version = "0.10.0", features = ["mutex", "spin_mutex", "portable-atomic"] }
regex = { version = "1.12.3", default-features = false, features = ["perf", "unicode"] }
portable-atomic = { version = "1.13.1" }
portable-atomic-util = { version = "0.2.6", features = ["alloc"] }
rstest = "0.26.1"
serial_test = "3.2.0"
burn-fusion = { version = "0.21.0", default-features = false }
burn-cubecl = { version = "0.21.0", default-features = false }
burn-optim = { version = "0.21.0" }
burn-rl = { version = "0.21.0" }
dirs = "6.0.0"
tracing-appender = "0.2.3"
tracing-core = { version = "0.1.36", default-features = false }
nvml-wrapper = "0.12.0"
sysinfo = "0.38.0"
systemstat = "0.2.6"
async-channel = "2.5"
burn-flex = { version = "0.21.0" }

[profile.profiling]
inherits = "release"
debug = 2

[package]
name = "crabjar"
publish = true
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "CLI for local state-docs management with project-scoped CrabJar config loading"
repository.workspace = true
documentation.workspace = true

[[bin]]
name = "crabjar"
path = "src/main.rs"

[lib]
name = "crabjar_lib"
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

# Error handling
thiserror.workspace = true

# Project workspace configuration
crabjar-config = { path = "src/crabjar-config" }

# Knowledge store
agent-context = { path = "memory" }
crabjar-guard = { path = "guard" }
crabjar-telemetry = { path = "telemetry" }

# Database
rusqlite.workspace = true

# CLI parsing
clap.workspace = true

# UUID
uuid.workspace = true
cargo-declared = "0.1.3"
tiktoken-rs = "0.11.0"
chrono.workspace = true
tempfile.workspace = true
which.workspace = true

[build-dependencies]
clap = { workspace = true }
clap_mangen = { workspace = true }

[dev-dependencies]
tempfile.workspace = true
