[workspace]
members = [
    "src/crabjar-config",
    "memory",
    "orchestrator",
    "src/codeburn-provider",
    "src/codeburn-config",
    "src/codeburn-classifier",
    "src/codeburn-pricing",
    "src/codeburn",
    "src/skill-script-runner",
    "src/skill-reference-store",
    "guard",
    "telemetry",
    "sandbox",
    "safetensors",
    "tool_registry",
    "zed-acp-bridge",
    "zed-acp-server",
    "rust-sdk/crates/rmcp",
    "rust-sdk/crates/rmcp-macros",
    "candle/candle-core",
    "candle/candle-nn",
    "candle/candle-transformers",
    "candle/candle-datasets",
    "burn/crates/burn",
    "burn/crates/burn-core",
    "burn/crates/burn-candle",
    "burn/crates/burn-nn",
    "burn/crates/burn-autodiff",
    "burn/crates/burn-train",
    "burn/crates/burn-cpu",
]

resolver = "2"

[workspace.package]
version = "0.10.2"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["CrabJar Contributors"]
repository = "https://github.com/crabjar/crabjar"
documentation = "https://docs.crabjar.io"
homepage = "https://crabjar.io"
description = "CrabJar workspace"
keywords = ["ml", "mcp", "cli"]
categories = ["science", "network-programming", "asynchronous"]

[workspace.lints.clippy]
[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_html_tags = "deny"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.51.1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["time"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Database
rusqlite = { version = "0.37", features = ["bundled"] }

# CLI parsing
clap = { version = "4.5", features = ["derive", "env"] }
clap_mangen = "0.2"

# UI / TTY
crossterm = "0.28"
ratatui = "0.30.0"

tempfile = "3.24.0"
uuid = { version = "1.23.0", features = ["v4"] }
chrono = { version = "0.4.38", default-features = false, features = ["serde", "now"] }

# Networking
reqwest = { version = "0.13.2", default-features = false, features = ["json", "stream"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tower-http = { version = "0.5", features = ["cors"] }
futures-util = "0.3"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Cargo tools
cargo-declared = "0.1.3"

# Security
ignore = "0.4"
path-absolutize = "3.1"
sha2 = "0.10"
hex = "0.4"

# Zed extension API
zed_extension_api = "0.2"

# CrabJar lib
crabjar_lib = { path = ".", package = "crabjar" }

# ML inference
candle-core = { path = "candle/candle-core", version = "0.10.2", package = "candle-core" }
candle-nn = { version = "0.10.2", path = "candle/candle-nn" }
candle-transformers = { path = "candle/candle-transformers", version = "0.10.2" }
candle-datasets = { path = "candle/candle-datasets", version = "0.10.2" }

# Burn framework
burn = { path = "burn/crates/burn", version = "0.22.0-pre.1", default-features = false }
burn-core = { version = "0.10.2", path = "burn/crates/burn-core" }
burn-candle = { version = "0.10.2", path = "burn/crates/burn-candle" }
burn-nn = { version = "0.10.2", path = "burn/crates/burn-nn" }
burn-autodiff = { version = "0.10.2", path = "burn/crates/burn-autodiff" }
burn-train = { path = "burn/crates/burn-train", version = "0.22.0-pre.1", default-features = false }
burn-cpu = { version = "0.10.2", path = "burn/crates/burn-cpu" }

# MCP protocol
rmcp = { path = "rust-sdk/crates/rmcp", version = "1.7.0", features = ["server", "macros"] }
rmcp-macros = { version = "0.10.2", path = "rust-sdk/crates/rmcp-macros" }
schemars = { version = "1.0", features = ["chrono04"] }
pastey = { version = "0.2.0" }

# Shared ML deps
safetensors = { version = "0.7.0", default-features = false }

[profile.profiling]
inherits = "release"
debug = 2

[package]
name = "crabjar"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "CLI for local state-docs management with project-scoped CrabJar config loading"
repository.workspace = true
documentation.workspace = true

[[bin]]
name = "crabjar"
path = "src/main.rs"

[lib]
name = "crabjar_lib"
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

# Project workspace configuration
crabjar-config = { path = "src/crabjar-config" }

# Knowledge store
agent-context = { path = "memory" }
crabjar-guard = { path = "guard" }
crabjar-telemetry = { path = "telemetry" }

# Database
rusqlite.workspace = true

# CLI parsing
clap.workspace = true

# UUID
uuid.workspace = true
cargo-declared = "0.1.3"
tiktoken-rs = "0.11.0"
chrono.workspace = true
tempfile.workspace = true

[build-dependencies]
clap = { workspace = true }
clap_mangen = { workspace = true }

[dev-dependencies]
tempfile.workspace = true
