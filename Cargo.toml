[workspace]
members = [
    "memory",
    "orchestrator",
    "guard",
    "telemetry",
    "src/skill-script-runner",
    "src/skill-reference-store",
    "zed-acp-bridge",
    "zed-acp-server",
    "axum-mux"
]

resolver = "2"

[workspace.package]
version = "0.11.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["CrabJar Contributors"]
repository = "https://github.com/crombojambo/crabjar"
documentation = "https://docs.crabjar.io"
homepage = "https://crabjar.io"
description = "CrabJar workspace"
keywords = ["ml", "mcp", "cli"]
categories = ["science", "network-programming", "asynchronous"]

[workspace.lints.clippy]
[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_html_tags = "deny"

[workspace.dependencies]
# Async runtime
async-trait = "0.1"
futures = "0.3"
tokio = { version = "1.51.1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["time"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Database
rusqlite = { version = "0.37", features = ["bundled"] }

# CLI parsing
clap = { version = "4.5", features = ["derive", "env"] }
clap_mangen = "0.2"

# UUID / time
uuid = { version = "1.23.0", features = ["v4"] }
chrono = { version = "0.4.38", default-features = false, features = ["serde", "now"] }
tempfile = "3.24.0"

# Networking
reqwest = { version = "0.13.2", default-features = false, features = ["json", "stream"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tower-http = { version = "0.5", features = ["cors"] }
futures-util = "0.3"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Cargo tools
cargo-declared = "0.1.3"

# Security / filesystem
ignore = "0.4"
path-absolutize = "3.1"
sha2 = "0.10"
hex = "0.4"

# Utility
which = "7"

# Zed extension API
zed_extension_api = "0.2"

# CrabJar lib
crabjar_lib = { path = ".", package = "crabjar" }

# Tokenization
tiktoken-rs = "0.11.0"

# Testing
rstest = "0.26.1"
serial_test = "3.2.0"

[profile.profiling]
inherits = "release"
debug = 2

[package]
name = "crabjar"
publish = true
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "CLI for local state-docs management with project-scoped CrabJar config loading"
repository.workspace = true
documentation.workspace = true

[[bin]]
name = "crabjar"
path = "src/main.rs"

[lib]
name = "crabjar_lib"
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

# Error handling
thiserror.workspace = true

# Knowledge store
agent-context = { path = "memory" }
crabjar-guard = { path = "guard" }
crabjar-telemetry = { path = "telemetry" }

# Database
rusqlite.workspace = true

# CLI parsing
clap.workspace = true

# UUID
uuid.workspace = true
cargo-declared = "0.1.3"
tiktoken-rs = "0.11.0"
chrono.workspace = true
tempfile.workspace = true
which.workspace = true

[build-dependencies]
clap = { workspace = true }
clap_mangen = { workspace = true }

[dev-dependencies]
tempfile.workspace = true

# vm-bridge: Per-VM websocket relay for display protocols (for screen sharing)
vm-bridge = { path = "axum-mux" }

