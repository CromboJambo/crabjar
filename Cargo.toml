[workspace]
members = [
    # Core crates
    "crates/memory",
    "crates/guard",
    "telemetry",
    "crates/orchestrator",
    "crates/sandbox",
    "crates/crabjar/tool_registry",
    "vm/axum-mux",
    "crates/crabjar/crabjar-architecture",
    "crates/podman",
    # Analysis toolkit
    "crates/analyze/analyze-common",
    "crates/analyze/analyze-apk",
    "crates/analyze/analyze-dotnet",
    "crates/analyze/analyze-firmware",
    "crates/analyze/analyze-har",
    "crates/analyze/analyze-js",
    "crates/analyze/analyze-native",
    "crates/analyze/analyze-mcp-server",
    # Host runtime
    "host/host-core",
    "host/host-system",
    "host/host-observe",
    "host/host-agent",
    "host/host-webview",
    "host/host-mqtt",
    "host/host-graph",
    "host/host-screen",
    # Terminal multiplexer integration
    "crates/terminal",
    # Training dataset extraction (harvest stage of the MoC training harness)
    "crates/train-extract",
    # Training data preprocessing: secret stripping
    "crates/train-secret-stripper",
    # Training data deduplication engine with occurrence tracking
    "crates/train-dedup",
    # File watcher daemon for training data pipeline
    "crates/train-filewatcher",
    # Host apps
    "apps/teams",
    # Host binary
    "crates/crabjar/crabjar-host",
    # Skill crates
    "crates/crabjar/skill-script-runner",
    "crates/crabjar/skill-reference-store",
    "crates/crabjar/skill-process-management",
    "crates/crabjar/hermes-struct-tok-pipeline",
    # Scheduler — cron jobs, workers, watchers with execution gating
    "crates/scheduler",
    # Zed ACP
    "crates/zed-acp-bridge",
    "crates/zed-acp-server",
    # Plugin system
    "crates/crabjar/crabjar-plugin", "crates/slow-friend",
    # GPU-accelerated agent dashboard (proof-of-concept)
    "crates/crabjar/crabjar-gpui",
    # Git operations for crabjar IDE (diff, status, add, commit via libgit2)
    "crates/crabjar/crabjar-git",
    # Commit message generation from git diffs
    "crates/crabjar/crabjar-commit",
    # CLI tool for commit message generation and staging
    "crates/crabjar/crabjar-commit-cli",
    # Kanban orchestrator — maps inputs to hermes agent kanban operations
    "crates/crabjar/crabjar-kanban-orchestrator",
    # SSH bastion host using russh (transparent proxy, no client app needed)
    "crates/ssh-bastion", "vm/vm-core", "crates/crabjar/crabjar-conductor", "crates/crabjar/crabjar-worker", "crates/crabjar/crabjar-durable-objects",
 "crates/crabjar/crabjar-analyze", "crates/crabjar/crabjar-review", "crates/crabjar/crabjar-mcp-tool-registry",    "crates/crabjar/crabjar-web-search",
    "crates/crabjar/crabjar-skills",    "crates/crabjar/crabjar-tool-binding",    "crates/crabjar/crabjar-github-client",
    "crates/crabjar/crabjar-clawhub-client",
    "crates/crabjar/crabjar-skill-scanner",
    "crates/crabjar/crabjar-trust-manager",    "crates/crabjar/crabjar-compress",
    "crates/crabjar/crabjar-compress-mcp",
    "crates/crabjar/crabjar-unsloth-mcp",
    "crates/crabjar/crabjar-herdr-mcp",
    "crates/crabjar/crabjar-structured-aux",
    "crates/universal-structure",
    "crates/email-smtp", "crates/crabjar/crabjar-web-extract", "crates/crabjar/crabjar-browser", "crates/crabjar/crabjar-memory", "crates/crabjar/crabjar-delegation", "crates/crabjar/crabjar-cron", "crates/crabjar/crabjar-homeassistant", "crates/crabjar/crabjar-deploy",
    # Performance benchmarks for execution pipeline
    "crates/benchmarks",
]

resolver = "2"

[workspace.package]
version = "0.12.5"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["CrabJar Contributors"]
repository = "https://github.com/crombojambo/crabjar"
documentation = "https://docs.crabjar.io"
homepage = "https://crabjar.io"
description = "CrabJar workspace"
keywords = ["ml", "mcp", "cli", "runtime"]
categories = ["science", "network-programming", "asynchronous"]

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_docs_in_private_items = "allow"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_html_tags = "deny"

[workspace.dependencies]
# Async runtime
async-trait = "0.1"
futures = "0.3"
tokio = { version = "1.51.1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["time"] }

# Serialization
schemars = "0.8"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Patterns
regex = "1.12"

# Database
rusqlite = { version = "0.37", features = ["bundled"] }

# CLI parsing
clap = { version = "4.5", features = ["derive", "env"] }
clap_mangen = "0.2"

# UI / TTY
crossterm = "0.28"
ratatui = "0.30"

# WebView / Tauri
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tauri-plugin-tray = "2"

# System integration
libnotify = "1.0"
arboard = "3"
keyring = "3"

# MQTT
rumqttc = "0.24"

# UUID / time
uuid = { version = "1.23.0", features = ["v4", "serde"] }
chrono = { version = "0.4.38", default-features = false, features = ["serde", "now"] }
tempfile = "3.24.0"

# Networking
reqwest = { version = "0.13.2", default-features = false, features = ["json", "stream"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
tower-http = { version = "0.5", features = ["cors"] }
futures-util = "0.3"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tracing-error = "0.2"

# Cargo tools
cargo-declared = "0.1.3"

# Security / filesystem
ignore = "0.4"
path-absolutize = "3.1"
sha2 = "0.10"
hex = "0.4"

# Utility
which = "7"
dirs = "6.0"
base64 = "0.22"

# Zed extension API
zed_extension_api = "0.2"

# CrabJar lib
crabjar_lib = { path = ".", package = "crabjar" }

# Tokenization
tiktoken-rs = "0.11.0"

# Model weights (dataset manifests; same crate pesti uses)
safetensors = { version = "0.7.0", default-features = false, features = ["std"] }
agent-context = { path = "crates/memory" }

# Testing
rstest = "0.26.1"
serial_test = "3.2.0"

# Fix xattr ENOATTR issue on newer glibc (Ubuntu 26+)
xattr = "1.7"

[profile.profiling]
inherits = "release"
debug = 2

[profile.release]
opt-level = 3
lto = true
strip = true

[package]
name = "crabjar"
publish = true
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "CLI for local state-docs management with project-scoped CrabJar config loading"
repository.workspace = true
documentation.workspace = true

[[bin]]
name = "crabjar"
path = "src/main.rs"

[[test]]
name = "cli"
harness = true

[[test]]
name = "e2e"
path = "tests/e2e/mod.rs"

[[test]]
name = "e2e_full"
path = "tests/e2e/full.rs"

[lib]
name = "crabjar_lib"
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

# Error handling
thiserror.workspace = true

# Knowledge store
agent-context = { path = "crates/memory" }
crabjar-guard = { path = "crates/guard" }
crabjar-podman = { path = "crates/podman" }
crabjar-ssh-bastion = { path = "crates/ssh-bastion" }
crabjar-lab-topology = { path = "crates/lab-topology" }
crabjar-telemetry = { path = "telemetry", features = ["otel"] }
crabjar-tool-registry = { path = "crates/crabjar/tool_registry" }
crabjar-terminal = { path = "crates/terminal" }
crabjar-slow-friend = { path = "crates/slow-friend", package = "slow-friend" }
crabjar-skills = { path = "crates/crabjar/crabjar-skills" }
crabjar-tool-binding = { path = "crates/crabjar/crabjar-tool-binding" }
crabjar-github-client = { path = "crates/crabjar/crabjar-github-client" }
crabjar-clawhub-client = { path = "crates/crabjar/crabjar-clawhub-client" }
crabjar-skill-scanner = { path = "crates/crabjar/crabjar-skill-scanner" }
crabjar-trust-manager = { path = "crates/crabjar/crabjar-trust-manager" }
crabjar-durable-objects = { path = "crates/crabjar/crabjar-durable-objects" }
dirs.workspace = true

# Database
rusqlite.workspace = true

# CLI parsing
clap.workspace = true
crossterm.workspace = true
ratatui.workspace = true

# UUID
uuid.workspace = true
cargo-declared = "0.1.3"
tiktoken-rs = "0.11.0"
chrono.workspace = true
tempfile.workspace = true
which.workspace = true
lazy_static = "1.5.0"
reqwest.workspace = true

[build-dependencies]
clap = { workspace = true }
clap_mangen = { workspace = true }

[dev-dependencies]
tempfile.workspace = true
crabjar-host-core = { path = "host/host-core" }
crabjar-host-agent = { path = "host/host-agent" }
universal-structure = { path = "crates/universal-structure" }
insta = { version = "1.43", features = ["json"] }

