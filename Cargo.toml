[package]
name = "crabjar"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "CLI for local state-docs management with project-scoped CrabJar config loading"
repository.workspace = true
documentation.workspace = true

[[bin]]
name = "crabjar"
path = "src/main.rs"

[lib]
name = "crabjar_lib"
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

# Project workspace configuration
crabjar-config = { path = "src/crabjar-config" }

# Knowledge store
agent-context = { path = "memory" }
crabjar-guard = { path = "guard" }
crabjar-telemetry = { path = "telemetry" }

# Database
rusqlite.workspace = true

# CLI parsing
clap.workspace = true

# UUID
uuid.workspace = true
cargo-declared = "0.1.3"
tiktoken-rs = "0.11.0"
chrono.workspace = true
tempfile.workspace = true

[build-dependencies]
clap = { workspace = true }
clap_mangen = { workspace = true }

[dev-dependencies]
tempfile.workspace = true
