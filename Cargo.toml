[workspace]
members = [
    "src/crabjar-config",
    "memory",
    "orchestrator",
    "src/codeburn-provider",
    "src/codeburn-config",
    "src/codeburn-classifier",
    "src/codeburn-pricing",
    "src/codeburn",
    "src/skill-script-runner",
    "src/skill-reference-store",
    "guard",
    "telemetry",
    "sandbox",
    "safetensors",
    "tool_registry",
    "zed-acp-bridge",
    "zed-acp-server",
    "rust-sdk/crates/rmcp",
    "rust-sdk/crates/rmcp-macros",
    "candle/candle-core",
    "candle/candle-nn",
    "candle/candle-transformers",
    "candle/candle-datasets",
    "burn/crates/burn",
    "burn/crates/burn-core",
    "burn/crates/burn-candle",
    "burn/crates/burn-nn",
    "burn/crates/burn-autodiff",
    "burn/crates/burn-train",
    "burn/crates/burn-cpu",
]

resolver = "2"

[workspace.package]
version = "0.10.2"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["CrabJar Contributors"]
repository = "https://github.com/crabjar/crabjar"
documentation = "https://docs.crabjar.io"
homepage = "https://crabjar.io"
description = "CrabJar workspace"
keywords = ["ml", "mcp", "cli"]
categories = ["science", "network-programming", "asynchronous"]

[workspace.lints.clippy]
[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_html_tags = "deny"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.51.1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["time"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Database
rusqlite = { version = "0.37", features = ["bundled"] }

# CLI parsing
clap = { version = "4.5", features = ["derive", "env"] }
clap_mangen = "0.2"

# UI / TTY
crossterm = "0.28"
ratatui = "0.30.0"

tempfile = "3.24.0"
uuid = { version = "1.23.0", features = ["v4"] }
chrono = { version = "0.4.38", default-features = false, features = ["serde", "now"] }

# Networking
reqwest = { version = "0.13.2", default-features = false, features = ["json", "stream"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tower-http = { version = "0.5", features = ["cors"] }
futures-util = "0.3"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Cargo tools
cargo-declared = "0.1.3"

# Security
ignore = "0.4"
path-absolutize = "3.1"
sha2 = "0.10"
hex = "0.4"

# Zed extension API
zed_extension_api = "0.2"

# CrabJar lib
crabjar_lib = { path = ".", package = "crabjar" }

# ML inference
candle = { path = "candle/candle-core", version = "0.10.2", package = "candle-core" }
candle-nn = { version = "0.10.2", path = "candle/candle-nn" }
candle-transformers = { path = "candle/candle-transformers", version = "0.10.2" }
candle-datasets = { path = "candle/candle-datasets", version = "0.10.2" }
candle-ug = { version = "0.10.2", path = "candle/candle-ug" }
cudarc = { version = "0.19.4", features = ["std", "cublas", "cublaslt", "curand", "driver", "nvrtc", "f16", "f8", "cuda-version-from-build-system", "dynamic-linking"], default-features = false }
gemm = { version = "0.19.0", features = ["wasm-simd128-enable"] }
half = { version = "2.7.1", features = ["num-traits", "use-intrinsics", "rand_distr"] }
float8 = { version = "0.7.0", features = ["num-traits", "rand_distr"] }
tokenizers = { version = "0.22.0", default-features = false }
hf-hub = "0.4.1"
rayon = "1.10.0"
memmap2 = { version = "0.9.3", features = ["stable_deref_trait"] }
num_cpus = "1.15.0"
ug = "0.5.0"
ug-cuda = "0.5.0"
ug-metal = "0.5.0"
yoke = { version = "0.8.1", features = ["derive"] }
accelerate-src = { version = "0.3.2" }
intel-mkl-src = { version = "0.8.1", features = ["mkl-static-lp64-iomp"] }

# Burn framework
burn = { path = "burn/crates/burn", version = "0.22.0-pre.1", default-features = false }
burn-core = { version = "0.10.2", path = "burn/crates/burn-core" }
burn-candle = { version = "0.10.2", path = "burn/crates/burn-candle" }
burn-nn = { version = "0.10.2", path = "burn/crates/burn-nn" }
burn-autodiff = { version = "0.10.2", path = "burn/crates/burn-autodiff" }
burn-train = { path = "burn/crates/burn-train", version = "0.22.0-pre.1", default-features = false }
burn-cpu = { version = "0.10.2", path = "burn/crates/burn-cpu" }
burn-cuda = { version = "0.10.2", path = "burn/crates/burn-cuda" }
burn-wgpu = { path = "burn/crates/burn-wgpu", version = "0.22.0-pre.1", default-features = false }
burn-rocm = { version = "0.10.2", path = "burn/crates/burn-rocm" }
burn-cubecl = { path = "burn/crates/burn-cubecl", version = "0.22.0-pre.1", default-features = false }
burn-backend = { path = "burn/crates/burn-backend", version = "0.22.0-pre.1", default-features = false }
burn-communication = { path = "burn/crates/burn-communication", version = "0.22.0-pre.1", default-features = false }
burn-remote = { version = "0.10.2", path = "burn/crates/burn-remote" }
burn-store = { path = "burn/crates/burn-store", version = "0.22.0-pre.1", default-features = false }
cubecl = { git = "https://github.com/tracel-ai/cubecl", default-features = false, rev = "0751cf6a5005c1755c1cd44d1c9383e7b1de814c" }
cubecl-common = { git = "https://github.com/tracel-ai/cubecl", default-features = false, rev = "0751cf6a5005c1755c1cd44d1c9383e7b1de814c" }
cubecl-zspace = { git = "https://github.com/tracel-ai/cubecl", default-features = false, rev = "0751cf6a5005c1755c1cd44d1c9383e7b1de814c" }
cubek = { git = "https://github.com/tracel-ai/cubek", default-features = false, rev = "0d259b53ff086b727dc1cdf001d064585bbc78bc" }

# MCP protocol
rmcp = { path = "rust-sdk/crates/rmcp", version = "1.7.0", features = ["server", "macros"] }
rmcp-macros = { version = "0.10.2", path = "rust-sdk/crates/rmcp-macros" }
schemars = { version = "1.0", features = ["chrono04"] }
pastey = { version = "0.2.0" }

# Shared ML deps
safetensors = { version = "0.7.0", default-features = false }

# rand — unified across candle/burn/rmcp
rand = { version = "0.10.1", default-features = false, features = ["std_rng"] }
rand_distr = { version = "0.6.0", default-features = false }

# candle workspace deps
byteorder = { version = "1.4.3", default-features = false }
ciborium = { version = "0.2", default-features = false }
lzma-rust2 = "0.16.2"
textdistance = { version = "1.1.1", default-features = false }
nvml-wrapper = "0.12.0"
sysinfo = "0.38.0"
systemstat = "0.2.6"
bon = "3.8.2"
fancy-regex = "0.18.0"
libm = "0.2.15"
log = "0.4"
num-traits = { version = "0.2.19", default-features = false, features = ["libm"] }
parquet = "58"
serde_plain = "1.0.2"
objc2-metal = "0.3.1"
objc2-foundation = "0.3.1"
candle-kernels = { path = "candle/candle-kernels", version = "0.10.2" }
candle-metal-kernels = { path = "candle/candle-metal-kernels", version = "0.10.2" }
candle-onnx = { path = "candle/candle-onnx", version = "0.10.2" }
libc = { version = "0.2.186" }
zip = { version = "8.6.0", default-features = false }
criterion = { version = "0.8", default-features = false }
candle-flash-attn = { path = "candle/candle-flash-attn", version = "0.10.2" }
candle-flash-attn-v3 = { path = "candle/candle-flash-attn-v3", version = "0.10.2" }
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png"] }
imageproc = { version = "0.26.0", features = ["text"], default-features = false }
hound = "3.5.1"
ab_glyph = "0.2.23"

# burn workspace deps
burn-dispatch = { version = "0.10.2", path = "burn/crates/burn-dispatch" }
burn-derive = { path = "burn/crates/burn-derive", version = "0.22.0-pre.1", default-features = false }
burn-ir = { version = "0.10.2", path = "burn/crates/burn-ir" }
burn-fusion = { path = "burn/crates/burn-fusion", version = "0.22.0-pre.1", default-features = false }
burn-flex = { version = "0.10.2", path = "burn/crates/burn-flex" }
burn-ndarray = { version = "0.10.2", path = "burn/crates/burn-ndarray" }
burn-rl = { version = "0.10.2", path = "burn/crates/burn-rl" }
burn-tch = { path = "burn/crates/burn-tch", version = "0.22.0-pre.1", default-features = false }
burn-tensor-testgen = { path = "burn/crates/burn-tensor-testgen", version = "0.22.0-pre.1", default-features = false }
burn-backend-extension = { path = "burn/crates/burn-backend-extension", version = "0.22.0-pre.1", default-features = false }
burn-backend-tests = { path = "burn/crates/burn-backend-tests", version = "0.22.0-pre.1", default-features = false }
burn-no-std-tests = { path = "burn/crates/burn-no-std-tests", version = "0.22.0-pre.1", default-features = false }
derive-new = { version = "0.7.0", default-features = false }
cfg-if = "1.0.1"
hashbrown = "0.16"
parking_lot = { version = "0.12.5", default-features = false }
portable-atomic = { version = "1.13.1" }
portable-atomic-util = { version = "0.2.6", features = ["alloc"] }
spin = { version = "0.10.0", features = ["mutex", "spin_mutex", "portable-atomic"] }
bytemuck = "1.25.0"
enumset = { version = "1.1.13", default-features = false }
paste = "1"
serial_test = "3.2.0"
ahash = { version = "0.8.12", default-features = false }
aligned-vec = { version = "0.6", default-features = false }
bytes = { version = "1.11.1", default-features = false }
