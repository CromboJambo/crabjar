bincode = { version = "2.0.1", features = ["alloc", "serde"], default-features = false }
burn-dataset = { path = "burn/crates/burn-dataset", version = "0.22.0-pre.1", default-features = false }
burn-tensor = { path = "burn/crates/burn-tensor", version = "0.22.0-pre.1", default-features = false }
data-encoding = { version = "2.11.0", default-features = false, features = ["alloc"] }
flate2 = "1.1.9"
rmp-serde = { version = "1.3.1", default-features = false }
