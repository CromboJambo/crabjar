[package]
name = "orchestrator"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "ACP-compliant orchestrator for Zed and Local LLMs"
repository.workspace = true
documentation.workspace = true

[dependencies]
# Async runtime
async-trait.workspace = true
tokio.workspace = true
futures-util = "0.3"

# Serialization & JSON
serde.workspace = true
serde_json.workspace = true

# Networking (HTTP Server & Client)
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["cors", "auth"] }
reqwest = { workspace = true, features = ["json"] }

# Error handling
thiserror.workspace = true
anyhow = "1.0"

# Utilities
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
rusqlite.workspace = true
uuid.workspace = true

# Security layer
crabjar-guard = { path = "../guard" }

# Telemetry
crabjar-telemetry = { path = "../telemetry" }

# Knowledge store
agent-context = { path = "../memory" }

# Tool registry
crabjar-tool-registry = { path = "../tool_registry" }

# Web search tooling (P1-1)
crabjar-web-search = { path = "../crabjar-web-search" }

# Local LLM inference (placeholder — llm-runner moved to PESTI portable execution substrate)
# The native runner was removed; inference now delegates to external LLM servers.
futures.workspace = true

# Testing
serial_test = "3.2"
