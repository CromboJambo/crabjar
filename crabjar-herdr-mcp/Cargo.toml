[package]
name = "crabjar-herdr-mcp"
version = "0.12.0"
edition = "2024"
description = "MCP server wrapping herdr for fleet machine management and agent delegation"

[dependencies]
rmcp = { version = "3.5", features = ["server"] }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
schemars = { workspace = true }
anyhow = "1.0"
