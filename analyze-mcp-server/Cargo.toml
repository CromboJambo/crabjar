[package]
name = "analyze-mcp-server"
version = "0.12.3"
edition = "2024"
description = "MCP server exposing crabjar-analyze reverse engineering toolkit"
license = "AGPL-3.0-or-later"

[[bin]]
name = "analyze-mcp"
path = "src/main.rs"

[dependencies]
analyze-common = { path = "../analyze-common", version = "0.12.3" }
analyze-native = { path = "../analyze-native", version = "0.12.3" }
analyze-har = { path = "../analyze-har", version = "0.12.3" }
analyze-js = { path = "../analyze-js", version = "0.12.3" }
analyze-apk = { path = "../analyze-apk", version = "0.12.3" }
rmcp = { version = "3.5", features = ["server"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
