[package]
name = "crabjar-skill-scanner"
version = "0.12.0"
edition = "2024"
description = "Security scanning pipeline for CrabJar skills — checksum verification, pattern analysis, and risk assessment"
authors = ["CromboJambo"]
license = "AGPL-3.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
thiserror = "2"
sha2 = "0.10"
walkdir = "2"

[dev-dependencies]
tempfile = "3"