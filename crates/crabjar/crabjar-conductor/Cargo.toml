[package]
name = "crabjar-conductor"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Fleet orchestration service for crabjar agent coordination"

[[bin]]
name = "crabjar-conductor"
path = "src/main.rs"

[lib]
name = "crabjar_conductor"
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Crabjar review pipeline
crabjar-review = { path = "../crabjar-review" }

# HTTP server
axum = { workspace = true }
tower-http = { workspace = true }

# Database (embedded SQLite for conductor state)
rusqlite = { workspace = true }

# UUIDs and timestamps
uuid = { workspace = true }
chrono = { workspace = true }

# Tracing/logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# CLI parsing
clap = { workspace = true }

# HTTP client for pesti-server communication
reqwest = { version = "0.12", features = ["json", "blocking"], default-features = false }

# Crabjar dependencies
crabjar-guard = { path = "../../guard" }
crabjar-sandbox = { path = "../../sandbox" }
universal-structure = { path = "../../universal-structure" }

# Pesti semantic analyzers for code understanding
pesti-structural-tokenizer.workspace = true

# Authentication
jsonwebtoken = { version = "10.3", features = ["rust_crypto"] }

# Caching (SHA-256 for decision cache keys)
sha2 = { workspace = true }

# Audit logging infrastructure (mirror-lab integration)
mirror-log = { git = "https://github.com/CromboJambo/mirror-lab", package = "mirror-log", features = ["embedding"] }

[dev-dependencies]
tempfile = "3.20"

[lints]
workspace = true