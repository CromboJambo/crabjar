[package]
name = "crabjar-browser"
version = "0.12.5"
edition = "2024"
description = "Browser automation via Playwright subprocess for crabjar execution pipeline"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
tungstenite = "0.29"
reqwest = { version = "0.12", features = ["json"] }
anyhow = "1"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }

[[test]]
name = "integration"
path = "tests/integration.rs"