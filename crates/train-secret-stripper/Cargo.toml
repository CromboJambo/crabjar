[package]
name = "crabjar-train-secret-stripper"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Training data preprocessing: strip secret-shaped objects from session exports"

[dependencies]
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
tempfile = "3.10"
