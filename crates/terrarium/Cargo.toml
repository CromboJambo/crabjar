[package]
name = "terrarium"
version = "0.1.0"
edition = "2024"
description = "The terrarium — an isometric hermit-crab skin over the crabjar habitat contract (dagr v3). Phase 0: headless behavior simulator."
license = "MIT"

[workspace]

[[bin]]
name = "terrarium"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
ratatui = "0.30"
crossterm = { version = "0.28", features = ["event-stream"] }
notify = "7.0"
unicode-width = "0.2"

[profile.release]
lto = true
strip = true

[dev-dependencies]
tempfile = "3.27.0"
