[package]
name = "crabjar-gpui"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = "0.2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
chrono = "0.4"
anyhow = "1.0"
reqwest = { workspace = true, features = ["json", "stream"] }
futures-util = "0.3"
