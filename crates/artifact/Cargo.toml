[package]
name = "crabjar-artifact"
version = "0.1.0"
edition = "2024"
description = "Content-addressed artifact packaging for Rust projects (Guix/Nix-style)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "process"] }
sha2 = "0.10"
hex = "0.4"
flate2 = "1"
tar = "0.4"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "cargo-artifact"
path = "src/main.rs"