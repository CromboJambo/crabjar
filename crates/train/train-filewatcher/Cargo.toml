[package]
name = "crabjar-train-filewatcher"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "File watcher daemon for training data pipeline with DAGR persistence"

[dependencies]
notify = "6.1"
tokio = { version = "1.37", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Local crates
crabjar-train-secret-stripper = { path = "../train-secret-stripper" }
crabjar-train-dedup = { path = "../train-dedup" }
