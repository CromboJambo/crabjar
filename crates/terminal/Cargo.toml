[package]
name = "crabjar-terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Terminal multiplexer integration for agent harness — wezterm/zellij backends with asciinema recording"

[lib]
name = "crabjar_terminal"
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio = { workspace = true, features = ["full"] }
async-trait = { workspace = true }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Patterns (verifier: regex_match)
regex = { workspace = true }

# CLI parsing (for detecting installed tools)
which = { workspace = true }

# Tracing
tracing = { workspace = true }

# Time
chrono = { workspace = true, features = ["serde"] }

[dev-dependencies]
# Scratch dirs for the herdr-spike example
tempfile = { workspace = true }
