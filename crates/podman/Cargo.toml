[package]
name = "crabjar-podman"
version = "0.1.0"
edition = "2024"
description = "Podman container lifecycle management for CrabJar agent orchestration"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["process"] }
