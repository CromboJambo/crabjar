[package]
name = "crabjar-github-client"
version = "0.12.0"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["CrabJar Contributors"]
repository = "https://github.com/crombojambo/crabjar"
description = "GitHub API client for CrabJar skill discovery and installation"

[dependencies]
reqwest = { version = "0.12", features = ["json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
tempfile = "3"

[dev-dependencies]
mockito = "1"
tempfile = "3"
