[package]
name = "codeburn-classifier"
publish = false
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["CrabJar Contributors"]
description = "Deterministic 13-category task classifier (no LLM calls)"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
codeburn-provider = { path = "../codeburn-provider" }
chrono = { version = "0.4", features = ["serde"] }
