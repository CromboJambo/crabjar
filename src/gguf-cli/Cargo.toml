[package]
name = "crabjar-gguf-cli"
publish = false
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["CrabJar Contributors"]
description = "CLI tool to inspect GGUF model files: header, metadata, tensor list, quantization info"

[workspace]

[[bin]]
name = "gguf-inspect"
path = "src/main.rs"

[dependencies]
crabjar-gguf = { path = "../gguf" }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.24.0"
