[package]
name = "crabjar-gguf"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "GGUF model weight file parser: header, tensor metadata, KV config, quantization type detection"

[dependencies]
# Serialization
serde.workspace = true
serde_json.workspace = true

# Error handling
thiserror.workspace = true

# Binary I/O
byteorder = { workspace = true, features = ["std"] }
half = { workspace = true, features = ["serde"] }

# CrabJar shared
crabjar-config = { path = "../crabjar-config" }

[dev-dependencies]
tempfile.workspace = true
