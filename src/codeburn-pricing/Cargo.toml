[package]
name = "codeburn-pricing"
publish = false
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["CrabJar Contributors"]
description = "LiteLLM pricing engine with auto-cached 24h data"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json"] }
tracing = "0.1"
codeburn-classifier = { path = "../codeburn-classifier" }
codeburn-provider = { path = "../codeburn-provider" }
[dev-dependencies]
futures = "0.3"
