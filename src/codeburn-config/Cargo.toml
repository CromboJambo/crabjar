[package]
name = "codeburn-config"
publish = false
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["CrabJar Contributors"]
description = "CodeBurn workspace config struct and TOML parsing"

[dependencies]
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
tempfile.workspace = true
