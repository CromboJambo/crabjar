[package]
name = "crabjar-config"
publish = false
version = "0.1.0"
edition = "2024"
description = "Project workspace configuration for CrabJar agent toolboxes"
license = "MIT OR Apache-2.0"

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
serde_json = "1.0"

# Error handling
thiserror = "2.0"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
