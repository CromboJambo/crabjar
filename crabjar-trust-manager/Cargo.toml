[package]
name = "crabjar-trust-manager"
version = "0.12.0"
edition = "2024"
description = "Trust tier management and skill cache for CrabJar remote skills"
authors = ["CromboJambo"]
license = "AGPL-3.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"

[dev-dependencies]
tempfile = "3"
