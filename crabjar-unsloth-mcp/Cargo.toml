[package]
name = "crabjar-unsloth-mcp"
version = "0.12.3"
edition = "2024"
description = "MCP server wrapping Unsloth Studio for training data management and model fine-tuning"

[dependencies]
rmcp = { version = "3.5", features = ["server"] }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
schemars = { workspace = true }
anyhow = "1.0"
